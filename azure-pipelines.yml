trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  # Change to 'true' when the production database and settings exist.
  deployEnabled: 'false'

steps:
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: --configuration Release

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: '**/*.Tests.csproj'
    arguments: --configuration Release --no-build

- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: --configuration Release --output $(Build.ArtifactStagingDirectory)

- task: PublishBuildArtifacts@1
  displayName: 'Publish artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

- task: AzureRmWebAppDeployment@5
  displayName: 'Deploy'
  condition: and(succeeded(), eq(variables['deployEnabled'], 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: 'Azure subscription 1(3ed77e66-426e-4959-a6f2-add9fc3d59b3)'
    appType: 'webApp'
    WebAppName: authdoc-gabriel
    packageForLinux: '$(Build.ArtifactStagingDirectory)/**/*.zip'
