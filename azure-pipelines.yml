trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  # Change to 'true' when the production database and settings exist.
  deployEnabled: 'false'

steps:
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: --configuration Release

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: '**/*.Tests.csproj'
    arguments: --configuration Release --no-build

- task: DotNetCoreCLI@2
  displayName: 'Publish'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: --configuration Release --output $(Build.ArtifactStagingDirectory)

- task: PublishBuildArtifacts@1
  displayName: 'Publish artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

- task: AzureRmWebAppDeployment@5
  displayName: 'Deploy'
  condition: and(succeeded(), eq(variables['deployEnabled'], 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    ConnectionType: 'AzureRM'
    # The id of the Azure Resource Manager service connection in Azure DevOps (Project settings > Service connections).
    # It is the id of the connection, not of the Azure subscription, and it is not a secret.
    azureSubscription: '1736ff80-87bd-4e01-8e48-2d40bc9d560a'
    appType: 'webApp'
    WebAppName: authdoc-gabriel
    packageForLinux: '$(Build.ArtifactStagingDirectory)/**/*.zip'
