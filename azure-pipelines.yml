trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'
- task: DotNetCoreCLI@2
  displayName: 'Build on'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: --configuration Release

- task: DotNetCoreCLI@2
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: --configuration Release --output $(Build.ArtifactStagingDirectory)

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

- task: AzureRmWebAppDeployment@5
  inputs:
    ConnectionType: 'AzureRM'
    azureSubscription: 'Azure subscription 1(3ed77e66-426e-4959-a6f2-add9fc3d59b3)'
    appType: 'webApp'
    WebAppName: authdoc-gabriel
    packageForLinux: '$(Build.ArtifactStagingDirectory)/**/*.zip'
    
- script: |
    echo "Setting up Git credentials..."
    git config --global user.email "azure-pipelines@dev.azure.com"
    git config --global user.name "Azure Pipelines Bot"

    echo "Adding GitHub remote repository..."
    git remote add github https://$(GITHUB_PAT)@github.com/gcarvalhomain/Authdoc.git
    
    echo "Pushing updates to GitHub..."
    git push github HEAD:main --force
  displayName: 'Mirror to GitHub'